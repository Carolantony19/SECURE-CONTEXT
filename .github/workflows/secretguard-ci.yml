name: SecretGuard CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SecretGuard
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run SecretGuard Scan
        id: scan
        run: |
          # Scan the entire repo, output JSON for CI parsing.
          secretguard scan . --json scan-report.json --no-block || echo "SECRETS_FOUND=true" >> "$GITHUB_ENV"

      - name: Upload Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secretguard-report
          path: scan-report.json

      - name: Comment on PR (if secrets found)
        if: env.SECRETS_FOUND == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('scan-report.json', 'utf8'));
            const high = report.high || 0;
            const medium = report.medium || 0;

            let body = `## 🔒 SecretGuard-AI Scan Results\n\n`;
            body += `| Risk | Count |\n|------|-------|\n`;
            body += `| 🔴 HIGH | ${high} |\n`;
            body += `| 🟡 MEDIUM | ${medium} |\n`;
            body += `| 🟢 LOW | ${report.low || 0} |\n\n`;

            if (high > 0) {
              body += `> ⛔ **${high} HIGH-risk finding(s) detected!** `;
              body += `Please review and move secrets to environment variables.\n\n`;

              body += `### Findings\n\n`;
              for (const f of report.findings.filter(f => f.risk === 'HIGH')) {
                body += `- **${f.file}:${f.line}** — \`${f.variable}\` (entropy: ${f.entropy})\n`;
              }
            } else {
              body += `✅ No HIGH-risk secrets detected.\n`;
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Fail on HIGH findings
        if: env.SECRETS_FOUND == 'true'
        run: |
          echo "::error::SecretGuard detected HIGH-risk secrets. See scan report."
          exit 1
