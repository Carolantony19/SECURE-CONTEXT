# GitHub Actions: SecretGuard AI — scan for secrets on push/PR
name: SecretGuard CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for --history mode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SecretGuard AI
        run: pip install -e ".[dev]"

      - name: Run full scan
        run: secretguard scan . --format json -o report.json --no-block

      - name: Run history analysis
        run: secretguard scan . --history --format sarif -o report.sarif --no-block
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
        continue-on-error: true

      - name: Upload JSON report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secretguard-report
          path: report.json

      - name: Block on HIGH findings
        run: |
          HIGH=$(python -c "import json; d=json.load(open('report.json')); print(d.get('high', 0))")
          if [ "$HIGH" -gt 0 ]; then
            echo "❌ Found $HIGH HIGH-risk secret(s). Failing CI."
            exit 1
          fi
