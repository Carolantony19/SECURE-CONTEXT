# .pre-commit-hooks.yaml
# Allows any repo to adopt SecretGuard AI with 3 lines of YAML:
#
# repos:
#   - repo: https://github.com/Carolantony19/SECURE-CONTEXT
#     rev: v1.0.0
#     hooks:
#       - id: secretguard
#
- id: secretguard
  name: SecretGuard AI
  description: Detect hardcoded secrets and AI placeholder-to-credential swaps
  entry: secretguard check --staged
  language: python
  types: [text]
  stages: [pre-commit]
  always_run: true
  pass_filenames: false
