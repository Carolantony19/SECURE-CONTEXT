# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: secretguard
        name: SecretGuard-AI Secret Scanner
        entry: secretguard hook
        language: python
        always_run: true
        stages: [pre-commit]
        pass_filenames: false
        additional_dependencies: []
