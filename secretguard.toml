# Example secretguard.toml — place in your project root.
# Documented at docs/configuration.md

[scan]
# Shannon entropy threshold (bits per character).
entropy_threshold = 4.5

# File extensions to scan.
extensions = [".py", ".js", ".ts", ".env", ".yaml", ".yml", ".json", ".toml", ".tf"]

# Glob patterns to exclude from scanning.
exclude = [
    "node_modules/**",
    ".git/**",
    "__pycache__/**",
    "*.pyc",
    "venv/**",
    ".venv/**",
    "dist/**",
    "build/**",
    "*.egg-info/**",
    "*.lock",
    "*.min.js",
]

# Minimum value length to consider for entropy scoring.
min_secret_length = 8

# Maximum file size in bytes (files larger than this are skipped).
max_file_size = 10485760  # 10 MB

# Number of parallel worker threads for directory scanning.
parallel_workers = 4

# Additional placeholder patterns (Python regex, case-insensitive).
extra_placeholders = [
    "MY_CUSTOM_\\w+",
]

# Paths to include in allowlist (same syntax as .secretguardignore lines).
allowlist_paths = []


# Custom detection rules — each rule is a table with id, pattern, description, severity.
# Uncomment to add your own rules:
#
# [[rules]]
# id = "internal-token"
# pattern = "INTERNAL_TOKEN_[A-Z0-9]{32}"
# description = "Internal service token format"
# severity = "HIGH"
